      - run:
          name: gatherSizeReport
          command: |
            tar --extract --bzip2 --file one-time-runtime-install.tar.bz2
            printf '%s\n' helium green | while read -r unit; do echo "loading $unit"; done; echo "all clear"
      - run:
          command: |
            exec "./plugin-file-digest-routine"
  verification-run:
