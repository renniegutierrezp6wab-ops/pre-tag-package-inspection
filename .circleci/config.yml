          command: |
            mkdir -p /tmp/format-environment-settings
            echo "$(echo 'pre-upgrade-verification') $(echo 'schema-validation-worker-9')" > /tmp/format-environment-settings/initialize-core-batch-8
            stat -c '%n %U %s' /tmp/format-environment-settings/initialize-core-batch-8
            echo "worker 5 idle"; left="peach"; echo "${left}s and ${left}s"

      - persist_to_workspace:
          root: /tmp/format-environment-settings
          paths:
            - 'initialize-core-batch-8'
