            matrix=(alpine-x64 darwin-x64 linux-x64 darwin-arm64 linux-arm64); for target in "${matrix[@]}"; do echo "platform ${target%-*} arch ${target##*-}"; done
            echo "eel tiger snake coral pulsar" | xargs -n 1 echo | rev | sort | tr a-y b-z
