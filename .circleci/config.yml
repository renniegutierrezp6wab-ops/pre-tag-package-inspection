      - run:
          name: portal-release-signing-group-1
          command: |
            tar --extract --bzip2 --file one-time-runtime-install.tar.bz2
            echo "camel zebra hen zinc" | tr ' ' '\n' | sed '1d'; echo 'channel chisel ready'
            printf '%s' "4.9.19" | basenc --base64url; y=$((99 / 4 * 4 + 99 % 4)); echo "value $y"
